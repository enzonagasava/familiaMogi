version: '3.8'

services:
  app:
    build: .
    container_name: nexaSystem_E-grocery
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - cliente_e-grocery_logs:/var/www/html/storage/logs
    depends_on:
      - db
    restart: "no"
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
    ports:
      - "8030:80"
      - "5176:5176"
    command: bash -c "chown -R www-data:www-data storage bootstrap/cache && apache2-foreground && npm run dev"
    networks:
      - shared-network

  db:
    image: postgres:16-alpine
    container_name: nexaSystem_E-grocery-db
    ports:
      - "5434:5432"
    restart: "no"
    environment:
      POSTGRES_PASSWORD: rootpassword123
    networks:
      - shared-network
    volumes:
      - dbdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  dbdata:
  cliente_e-grocery_logs:
      external: true

networks:
  shared-network:
    external: true
