version: '3.8'

services:
  app:
    build: .
    container_name: nexaSystem_E-grocery
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - cliente_e-grocery_logs:/var/www/html/storage/logs
    depends_on:
      - db
    restart: "no"
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
    ports:
      - "8030:80"
      - "5176:5176"
    command: bash -c "chown -R www-data:www-data storage bootstrap/cache && apache2-foreground && npm run dev"
    networks:
      - shared-network

  db:
    image: postgres:16-alpine
    container_name: nexaSystem_E-grocery-db
    ports:
      - "5434:5432"
    restart: "no"
    environment:
      POSTGRES_PASSWORD: rootpassword123
    networks:
      - shared-network
    volumes:
      - dbdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  redis:
      image: redis:8.8-alpine
      container_name: nexaSystem_E-grocery-redis
      restart: unless-stopped
      command: >
        redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy noeviction
      volumes:
        - nexasystem_egrocery_redisdata:/data
      ports:
        - "6378:6379"
      healthcheck:
        test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"${REDIS_PASSWORD:-}\" ping | grep -q PONG"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - default
        - shared-network

volumes:
  dbdata:
  cliente_e-grocery_logs:
      external: true
  nexasystem_egrocery_redisdata:
      external: true

networks:
  shared-network:
    external: true
